name: Deploy Verso Docs

on:
  push:
    branches: [cruise]
    paths:
      - 'cedar-lean/doc/**'
      - 'cedar-lean/Cedar/Thm/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build docs
        working-directory: cedar-lean/doc
        run: |
          lake update
          lake build
          .lake/build/bin/generate-doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cedar-lean/doc/_out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
